<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Carson Shaffer</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <style>
:root {
  --bg: #f4f1ea;
  --ink: #1a1815;
  --muted: #6b6359;
  --rule: #d4ccbc;
  --accent: #2c4a3c;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1815;
    --ink: #ebe6dd;
    --muted: #8d8678;
    --rule: #3d3833;
    --accent: #8eb39e;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100vh; }

body {
  font-family: "Iowan Old Style", "Hoefler Text", "Palatino Linotype", Palatino, Cambria, Georgia, serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 56px 40px;
}
    @media (max-width: 760px) {
      body { align-items: center; }
    }
    .not-found {
      text-align: center;
      max-width: 480px;
    }
    .not-found h1 {
      font-size: clamp(72px, 14vw, 104px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 16px;
    }
    .not-found p {
      color: var(--muted);
      font-style: italic;
      font-size: 16px;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <div class="not-found">
    <h1>404</h1>
    <p>Page not found.</p>
    <a href="/">Return home</a>
  </div>
</body>
</html>
